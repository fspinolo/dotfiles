# Custom prefix: Ctrl+Space
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Navigation QoL
set -g mouse on
set -g focus-events on
set -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Splitting
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-like pane navigation (prefix + h/j/k/l)
# l shadows the default last-window binding; Tab covers that instead
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Tab last-window

# Config hacking devex
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Set the outer terminal's title to the session name so the
# terminal emulator (e.g. Warp) can show it as the tab title
set -g set-titles on
set -g set-titles-string '#S'

# Session states — color-code sessions in the switcher and status bar.
# review=yellow, active=green, experimental=magenta; unset = no dot.
# The dev tmuxinator templates set @state automatically (active for
# work sessions, experimental for devbrief planning); flip by hand
# with the prefixed keys below once a task's PR is up or done.
#
# A second, independent axis: @claude reflects the live state of a
# Claude Code session in that pane, set by hooks in
# ~/.claude/hooks/tmux-claude-state.sh. It renders as a trailing glyph
# (working=cyan …, waiting-on-you=red !, done=green ✓) so it stacks
# with the workflow dot above rather than replacing it.

# Session switcher (prefix + s): leading workflow dot + trailing Claude
# glyph around each session line
bind s choose-tree -Zs -F "#{?#{@state},#[fg=#{?#{==:#{@state},review},yellow,#{?#{==:#{@state},active},green,#{?#{==:#{@state},experimental},magenta,white}}}]● #[default],}#{session_name}: #{session_windows} windows#{?session_attached, (attached),}#{?#{@claude}, #[fg=#{?#{==:#{@claude},waiting},red,#{?#{==:#{@claude},working},cyan,#{?#{==:#{@claude},done},green,white}}}]#{?#{==:#{@claude},waiting},!,#{?#{==:#{@claude},working},…,#{?#{==:#{@claude},done},✓,•}}}#[default],}"

# Quick keys to set the current session's state (prefix + C-x)
bind C-p set @state review
bind C-a set @state active
bind C-e set @state experimental
bind C-d set @state ""

# Status bar — give the session name room so it isn't truncated.
# A state dot precedes the session-name block when @state is set.
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#{?#{@state},#[fg=#{?#{==:#{@state},review},yellow,#{?#{==:#{@state},active},green,#{?#{==:#{@state},experimental},magenta,white}}}]● #[default],}#[fg=black,bg=green,bold] #S #[default]#{?#{@claude}, #[fg=#{?#{==:#{@claude},waiting},red,#{?#{==:#{@claude},working},cyan,#{?#{==:#{@claude},done},green,white}}}]#{?#{==:#{@claude},waiting},!,#{?#{==:#{@claude},working},…,#{?#{==:#{@claude},done},✓,•}}}#[default],} "

# Enable true color (RGB) support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",$TERM:Tc"
