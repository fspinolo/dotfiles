# Custom prefix: Ctrl+Space
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Navigation QoL
set -g mouse on
set -g focus-events on
set -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Splitting
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-like pane navigation (prefix + h/j/k/l)
# l shadows the default last-window binding; Tab covers that instead
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Tab last-window

# Config hacking devex
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Set the outer terminal's title to the session name so the
# terminal emulator (e.g. Warp) can show it as the tab title
set -g set-titles on
set -g set-titles-string '#S'

# Status bar — give the session name room so it isn't truncated
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=black,bg=green,bold] #S #[default] "

# Enable true color (RGB) support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",$TERM:Tc"
