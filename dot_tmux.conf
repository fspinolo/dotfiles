# Custom prefix: Ctrl+Space
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Navigation QoL
set -g mouse on
set -g focus-events on
set -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# vi keys in copy-mode and the choose-tree chooser, so j/k scroll long
# lists (e.g. the session switcher below when many sessions are open)
set -g mode-keys vi

# Splitting
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-like pane navigation (prefix + h/j/k/l)
# l shadows the default last-window binding; Tab covers that instead
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Tab last-window

# Config hacking devex
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Set the outer terminal's title to the session name so the
# terminal emulator (e.g. Warp) can show it as the tab title
set -g set-titles on
set -g set-titles-string '#S'

# Session states — two independent per-session signals.
#
# @state: a workflow dot BEFORE the name, set only by the quick-keys
# below (review=yellow, active=green, experimental=magenta; unset = no
# dot). Manual on purpose — a deliberate mark, not auto-noise.
#
# @claude: a live glyph AFTER the name, set by Claude Code lifecycle
# hooks (~/.claude/hooks/tmux-claude-state.sh): working=cyan ▶,
# waiting-on-you=red !. A finished/idle session shows nothing, so any
# glyph means "this one wants attention."

# Session switcher (prefix + s): leading workflow dot + trailing Claude
# glyph around each session line. -N drops the preview pane so the whole
# (zoomed) pane is the list — fits many more sessions before scrolling.
bind s choose-tree -ZsN -F "#{?#{@state},#[fg=#{?#{==:#{@state},review},yellow,#{?#{==:#{@state},active},green,#{?#{==:#{@state},experimental},magenta,white}}}]● #[default],}#{session_name}: #{session_windows} windows#{?session_attached, (attached),}#{?#{@claude}, #[fg=#{?#{==:#{@claude},waiting},red,cyan}]#{?#{==:#{@claude},waiting},!,▶}#[default],}"

# Quick keys to set the current session's state (prefix + C-x)
bind C-p set @state review
bind C-a set @state active
bind C-e set @state experimental
bind C-d set @state ""

# Status bar — give the session name room so it isn't truncated.
# A state dot precedes the session-name block when @state is set.
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#{?#{@state},#[fg=#{?#{==:#{@state},review},yellow,#{?#{==:#{@state},active},green,#{?#{==:#{@state},experimental},magenta,white}}}]● #[default],}#[fg=black,bg=green,bold] #S #[default]#{?#{@claude}, #[fg=#{?#{==:#{@claude},waiting},red,cyan}]#{?#{==:#{@claude},waiting},!,▶}#[default],} "

# Enable true color (RGB) support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",$TERM:Tc"

# ── Plugins (TPM) ──────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session persistence across reboots. resurrect saves the full
# session/window/pane layout, working dirs, and pane contents;
# continuum auto-saves every 15 min and auto-restores on server start.
set -g @resurrect-capture-pane-contents 'on'

# Programs to relaunch on restore. The `->` inline strategy re-launches
# Claude Code as `claude -c` (continue that worktree's latest
# conversation) instead of the stale `--resume <id>` the pane was
# started with, so each dev pane returns on its own current session.
set -g @resurrect-processes 'vim "~claude->claude -c"'

set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Bootstrap TPM on a fresh machine, then install the plugins declared
# above. Must run after the @plugin lines so install_plugins sees them,
# and inside tmux so TPM's env (TMUX_PLUGIN_MANAGER_PATH) is resolved.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Keep last: initializes TPM and all plugins above.
run '~/.tmux/plugins/tpm/tpm'
