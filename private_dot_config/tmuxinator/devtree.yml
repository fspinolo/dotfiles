# Loancrate — repo root session inside a task worktree. No pnpm dev
# window by default; with worktree isolation enabled (pnpm
# worktree:enable), run pnpm dev in the shell window for this
# worktree's own isolated stack (own DB/ports/prefixes).
# Start with the `dev <task>` zsh alias, which creates the worktree
# and passes its path:
#   tmuxinator start devtree task=<task> workdir=<worktree-path>
name: dev-<%= @settings["task"] %>
root: <%= @settings["workdir"] %>

# Top (main) pane gets 40% height; bottom gets the remaining 60%.
# Mark a work session active (green dot in the switcher and status bar).
# on_project_start runs BEFORE tmux creates the session, so a -t set
# would no-op; defer it to a backgrounded waiter that fires once the
# session exists.
on_project_start: tmux set-option -g main-pane-height 40%; { until tmux has-session -t dev-<%= @settings["task"] %> 2>/dev/null; do sleep 0.05; done; tmux set-option -t dev-<%= @settings["task"] %> @state active; } &

# Focus the claude pane on attach (pane 2 in the code window, since
# pane-base-index is 1), rather than the default first pane (vim).
startup_pane: 2

windows:
  - code:
      layout: main-horizontal
      panes:
        - vim
        - claude
  - shell:
  - git: git status
