# Loancrate — repo root session inside a task worktree. No pnpm dev
# window: the dev stack is a singleton owned by the devroot session
# (shared docker + ports); run it manually in the shell window if this
# worktree's code should serve the stack instead.
# Start with the `dev <task>` zsh alias, which creates the worktree
# and passes its path:
#   tmuxinator start devtree task=<task> workdir=<worktree-path>
name: dev-<%= @settings["task"] %>
root: <%= @settings["workdir"] %>

# Top (main) pane gets 60% height; bottom gets the remaining 40%.
on_project_start: tmux set-option -g main-pane-height 60%

windows:
  - code:
      layout: main-horizontal
      panes:
        - vim
        - claude
  - shell:
  - git: git status
