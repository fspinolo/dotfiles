# Loancrate — repo root session inside a task worktree. No pnpm dev
# window by default; with worktree isolation enabled (pnpm
# worktree:enable), run pnpm dev in the shell window for this
# worktree's own isolated stack (own DB/ports/prefixes).
# Start with the `dev <task>` zsh alias, which creates the worktree
# and passes its path:
#   tmuxinator start devtree task=<task> workdir=<worktree-path>
name: dev-<%= @settings["task"] %>
root: <%= @settings["workdir"] %>

# Main (claude) pane on the left gets 50% width; vim takes the rest.
on_project_start: tmux set-option -g main-pane-width 50%

# claude is the main pane (pane 1, left) and is focused on attach.
startup_pane: 1

windows:
  - code:
      layout: main-vertical
      panes:
        - claude
        - vim
  - shell:
  - git: git status
