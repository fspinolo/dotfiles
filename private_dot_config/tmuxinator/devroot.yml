# Loancrate — repo root session on the main checkout; owns the dev
# stack (pnpm dev), which can only run once (shared docker + ports)
# Start with:  tmuxinator start devroot   (or the naked `dev` zsh alias)
name: devroot
root: /Users/felipespinolo/Development/loancrate

# Main (claude) pane on the left gets 50% width; vim takes the rest.
on_project_start: tmux set-option -g main-pane-width 50%

# claude is the main pane (pane 1, left) and is focused on attach.
startup_pane: 1

windows:
  - code:
      layout: main-vertical
      panes:
        - claude
        - vim
  - dev: pnpm dev
  - git: git status
