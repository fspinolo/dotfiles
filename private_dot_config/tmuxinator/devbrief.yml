# Loancrate — like devtree, but the Claude pane boots with a handoff
# brief so a fresh session starts with full context from another one.
# Started by the `devbrief <task> <brief>` zsh function, which creates
# the worktree, writes the brief to <worktree>/.handoff.md, and passes:
#   tmuxinator start devbrief task=<task> workdir=<worktree-path>
name: dev-<%= @settings["task"] %>
root: <%= @settings["workdir"] %>

# Top (main) pane gets 40% height; bottom gets the remaining 60%.
# Planning session — mark experimental (magenta dot in the switcher).
# on_project_start runs BEFORE tmux creates the session, so a -t set
# would no-op; defer it to a backgrounded waiter that fires once the
# session exists.
on_project_start: tmux set-option -g main-pane-height 40%; { until tmux has-session -t dev-<%= @settings["task"] %> 2>/dev/null; do sleep 0.05; done; tmux set-option -t dev-<%= @settings["task"] %> @state experimental; } &

# Focus the claude pane on attach (pane 2 in the code window, since
# pane-base-index is 1), rather than the default first pane (vim).
startup_pane: 2

windows:
  - code:
      layout: main-horizontal
      panes:
        - vim
        - 'claude --permission-mode plan "Read ./.handoff.md for your full briefing on this task. Study the files and prior work it references, then present a concise plan. You are in plan mode: investigate freely but make no changes."'
  - shell:
  - git: git status
