# Loancrate — single-package session under packages/<name> inside a
# task worktree
# Start with the `dev <task> <pkgname>` zsh alias, which creates the
# worktree and passes its path:
#   tmuxinator start devpkg <pkgname> task=<task> workdir=<worktree-path>
name: dev-<%= @settings["task"] %>-<%= @args.first %>
root: <%= @settings["workdir"] %>/packages/<%= @args.first %>

# Main (claude) pane on the left gets 50% width; vim takes the rest.
on_project_start: tmux set-option -g main-pane-width 50%

# claude is the main pane (pane 1, left) and is focused on attach.
startup_pane: 1

windows:
  - code:
      layout: main-vertical
      panes:
        - claude
        - vim
  - shell:
  - git: git status
